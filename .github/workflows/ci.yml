name: TICKET AI CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      VITE_SUPABASE_PROJECT_ID: local-test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Unit tests
        # Live-backend cases are skipped here on purpose: no production
        # credentials are ever exposed to untrusted pull-request code.
        # Their coverage is enforced by the protected `integration` job and by
        # the role-based SQL authorization suites below.
        run: npm test

      - name: Production build
        run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Edge Function typecheck
        run: find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | sort -z | xargs -0 deno check --frozen

      - name: Supabase configuration and migration safety
        run: node scripts/verify-supabase-safety.mjs

      - name: Phase 3 migration and billing safety
        run: scripts/verify-live-phase3-migrations.sh

      - name: Post-Phase 3 integrity migrations and SQL suites
        run: scripts/verify-integrity-migrations.sh

  # Protected integration coverage. Runs only from the `staging-integration`
  # environment (manual dispatch or a push to main), never from a fork PR, and
  # fails if any test is skipped unexpectedly.
  integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-integration
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: staging-integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require integration credentials
        run: |
          test -n "$TEST_SUPABASE_URL" || { echo "TEST_SUPABASE_URL missing"; exit 1; }
          test -n "$TEST_SUPABASE_PUBLISHABLE_KEY" || { echo "TEST_SUPABASE_PUBLISHABLE_KEY missing"; exit 1; }

      - name: Integration tests (no skips allowed)
        run: node scripts/run-integration-tests.mjs
