name: TICKET AI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      VITE_SUPABASE_PROJECT_ID: local-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Edge Function typecheck
        run: find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | sort -z | xargs -0 deno check --frozen

      - name: Supabase configuration and migration safety
        run: node scripts/verify-supabase-safety.mjs
